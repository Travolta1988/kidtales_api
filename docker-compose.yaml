services:
  api:
    build: .
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

  landing:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "server.mjs"]
    environment:
      PORT: "4173"
    volumes:
      - /var/www/kidtales-landing:/app
    restart: unless-stopped

  db:
    image: postgres:16
    env_file: .env.prod
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
