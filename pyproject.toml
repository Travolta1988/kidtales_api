[project]
name = "kidtales-app"
version = "0.1.0"
description = "API for fairy tales AI interactive generation"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16.5",
    "fastapi[standard]>=0.128.8",
    "openai>=1.40.0",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.1",
    "sqlalchemy>=2.0.52",
    "pwdlib[argon2]",
    "pyjwt",
    "google-auth",
    "requests>=2.34.2",
    "replicate>=1.0.7",
    "boto3>=1.43.108",
    "aioredis>=2.0.1",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "httpx",
]
